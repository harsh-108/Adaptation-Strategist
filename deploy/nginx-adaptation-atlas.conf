# nginx site for the Adaptation Atlas. Replace atlas.example.com with your domain (or the server's
# public IP while testing), then:
#   sudo cp deploy/nginx-adaptation-atlas.conf /etc/nginx/sites-available/adaptation-atlas
#   sudo ln -s /etc/nginx/sites-available/adaptation-atlas /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d atlas.example.com   (adds the 443 block and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name atlas.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:6004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts one proxy hop and reads the visitor's address from these headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI answers and saving a hub (which fetches open data) can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
